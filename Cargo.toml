[package]
name = "qbasic_interpreter"
version = "0.4.0"
edition = "2021"
# Lowest version the locked dependency tree builds with (checked in CI).
rust-version = "1.88"
description = "A terminal IDE and interpreter for a practical QBasic-inspired BASIC dialect."
license = "MIT"
repository = "https://github.com/conniecombs/Q-Basic-Studio"
readme = "README.md"
keywords = ["basic", "qbasic", "interpreter", "ide", "retro"]
categories = ["command-line-utilities", "development-tools", "compilers"]

[dependencies]
minifb = "0.25"
crossterm = "0.28"
ratatui = "0.29"
tui-textarea = "0.7"
arboard = "3.4"
tempfile = "3.27.0"
